[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "veggie-rescue-deliveries"
version = "0.1.0"
description = "Backend API for equitable food rescue delivery recommendations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19,<2.0",
    "fastapi[standard]>=0.116,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "psycopg[binary]>=3.3,<4.0",
    "python-dotenv>=1.1,<2.0",
    "sqlalchemy>=2.0,<2.1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.10,<3.0",
    "pytest>=9.1,<10.0",
    "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]